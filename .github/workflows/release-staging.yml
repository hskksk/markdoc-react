name: Release (npm staging)

on:
  push:
    branches:
      - main

concurrency:
  group: release-staging
  cancel-in-progress: false

jobs:
  release:
    uses: hskksk/gh-actions/.github/workflows/npm-release-staged.yml@v1
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    with:
      pnpm-version: "10.28.1"
      node-version: "24"
