name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hskksk/gh-actions/actions/setup-mise@v1

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build
