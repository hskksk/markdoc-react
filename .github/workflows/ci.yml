name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hskksk/gh-actions/setup-pnpm@v1
        with:
          pnpm-version: "10.28.1"
          node-version: "22"
          install: "true"
          frozen-lockfile: "true"

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build
