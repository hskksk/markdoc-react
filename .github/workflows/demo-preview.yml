name: Demo preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAGE_DIR: dev/preview-${{ github.event.pull_request.number }}

jobs:
  build-and-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hskksk/gh-actions/actions/setup-mise@v1

      - name: Build library
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Build demo (preview)
        env:
          GITHUB_PAGES_REPOSITORY: ${{ github.event.repository.name }}
          IS_PREVIEW: 'true'
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cd demo
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm run build

      - name: Move dist directory
        run: mv demo/dist /tmp/demo-dist

      - name: Prepare gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages
            git pull --ff-only origin gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            touch .nojekyll
          fi

      - name: Commit preview to gh-pages
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          rm -rf "${{ env.PAGE_DIR }}"
          mkdir -p "${{ env.PAGE_DIR }}"
          cp -r /tmp/demo-dist/* "${{ env.PAGE_DIR }}/"
          git add .nojekyll "${{ env.PAGE_DIR }}"
          if git diff --staged --quiet; then
            echo "No file changes on gh-pages"
          else
            git commit -m "Deploy PR preview for #${{ github.event.pull_request.number }}"
          fi

      - name: Push gh-pages
        run: git push origin gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ env.PAGE_DIR }}/
        with:
          script: |
            const marker = '<!-- demo-preview -->'
            const body = `${marker}\nDemo preview: ${process.env.PREVIEW_URL}`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove preview directory
        id: cleanup
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || exit 0
          if ! git show-ref --verify --quiet refs/heads/gh-pages; then
            echo "gh-pages branch does not exist; nothing to clean up"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout gh-pages
          git pull --ff-only origin gh-pages
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          rm -rf "${{ env.PAGE_DIR }}" || true
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to remove"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Remove PR preview for #${{ github.event.pull_request.number }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push gh-pages
        if: steps.cleanup.outputs.changed == 'true'
        run: git push origin gh-pages

      - name: Setup Pages
        if: steps.cleanup.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.cleanup.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.cleanup.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
